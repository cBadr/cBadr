<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Mohamed Badr, full-stack developer in Cairo. 43 public repositories, 469 contributions per year, 417 commits per year, 8 stars earned.">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1E293B"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" rx="16" fill="#0F172A"/>
  <rect width="1280" height="400" rx="16" fill="url(#dots)"/>
  <ellipse cx="1080" cy="70" rx="440" ry="260" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1279" height="399" rx="16" fill="none" stroke="#1E293B"/>

  <!-- terminal chrome -->
  <line x1="0" y1="52" x2="1280" y2="52" stroke="#1E293B"/>
  <circle cx="34" cy="26" r="6" fill="#EF4444"/>
  <circle cx="56" cy="26" r="6" fill="#F59E0B"/>
  <circle cx="78" cy="26" r="6" fill="#22C55E"/>
  <text x="112" y="31" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#94A3B8">cBadr &#8212; ~/projects</text>

  <text x="56" y="118" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#94A3B8"><tspan fill="#22C55E">$</tspan> whoami</text>

  <text x="56" y="188" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Mohamed Badr</text>

  <text x="56" y="230" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#94A3B8">Full-stack developer. I build SaaS products with Next.js, Laravel and Postgres.</text>
  <text x="56" y="260" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" fill="#94A3B8">Cairo, Egypt.</text>
  <rect x="184" y="243" width="9" height="20" fill="#22C55E">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.15s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(56,296)">
    <rect width="268" height="64" rx="10" fill="#0E1223" stroke="#1E293B"/>
    <text x="20" y="28" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="22" font-weight="700" fill="#22C55E">43</text>
    <text x="20" y="48" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#94A3B8" letter-spacing=".6">public repos</text>
  </g>
  <g transform="translate(340,296)">
    <rect width="268" height="64" rx="10" fill="#0E1223" stroke="#1E293B"/>
    <text x="20" y="28" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="22" font-weight="700" fill="#22C55E">469</text>
    <text x="20" y="48" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#94A3B8" letter-spacing=".6">contributions / yr</text>
  </g>
  <g transform="translate(624,296)">
    <rect width="268" height="64" rx="10" fill="#0E1223" stroke="#1E293B"/>
    <text x="20" y="28" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="22" font-weight="700" fill="#22C55E">417</text>
    <text x="20" y="48" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#94A3B8" letter-spacing=".6">commits / yr</text>
  </g>
  <g transform="translate(908,296)">
    <rect width="268" height="64" rx="10" fill="#0E1223" stroke="#1E293B"/>
    <text x="20" y="28" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="22" font-weight="700" fill="#22C55E">8</text>
    <text x="20" y="48" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#94A3B8" letter-spacing=".6">stars earned</text>
  </g>
</svg>
